# Sabaq on Cloudflare Workers.
# Build first (node build.mjs), then deploy (npx wrangler deploy).
name = "sabaq"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# The subdomain the game is served on. Cloudflare creates the DNS record
# automatically because ahmedmadany.com is on Cloudflare. Change it here.
routes = [
  { pattern = "sabaq.ahmedmadany.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

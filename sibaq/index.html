<title>Sibaq</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;700&family=Martian+Mono:wght@500;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: a night race track. Asphalt ground, faint lane stripes, one signal-yellow accent,
   four racing-livery answer colours. The host screen is a broadcast stage; phones are pit-lane pads. */
:root{
  color-scheme: dark;
  --asphalt:#12141A;
  --asphalt-2:#1A1D25;
  --asphalt-3:#252A35;
  --rim:#353B4A;
  --line:rgba(243,239,228,.12);
  --chalk:#F3EFE4;
  --dim:#A7ABB7;
  --faint:#6E7383;
  --signal:#F7CF3D;
  --signal-ink:#1E1A08;
  --ink:#16110E;
  --a0:#FF5A76;   /* rose */
  --a1:#FFA02E;   /* tangerine */
  --a2:#19C9AC;   /* lagoon */
  --a3:#6F86FF;   /* cobalt */
  --good:#3EDC8B;
  --bad:#FF6262;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree","Thmanyah","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --radius:16px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--asphalt);color:var(--chalk);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
:lang(ar),[lang="ar"]{font-family:"Thmanyah","IBM Plex Sans Arabic",var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:40px}
.checker{background:conic-gradient(var(--chalk) 25%,var(--asphalt) 0 50%,var(--chalk) 0 75%,var(--asphalt) 0) 0 0/10px 10px}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;transition:transform .12s ease,background .15s ease,opacity .15s;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-signal{background:var(--signal);color:var(--signal-ink)}
.btn-signal:hover:not([disabled]){background:#FFDB57}
.btn-ghost{background:transparent;color:var(--chalk);box-shadow:inset 0 0 0 1.5px var(--rim)}
.btn-ghost:hover:not([disabled]){box-shadow:inset 0 0 0 1.5px var(--chalk)}
.btn-quiet{background:var(--asphalt-3);color:var(--chalk)}
.btn-quiet:hover:not([disabled]){background:var(--rim)}
.btn-danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 55%,transparent)}
.btn.sm{padding:9px 15px;font-size:14px}
.btn.lg{padding:17px 34px;font-size:19px}
.icon-btn{appearance:none;border:0;background:var(--asphalt-3);color:var(--chalk);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:16px}
.icon-btn:hover{background:var(--rim)}
.icon-btn svg{width:18px;height:18px}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--dim)}
.input,.select,textarea.input{background:var(--asphalt);border:1.5px solid var(--rim);border-radius:12px;padding:11px 14px;width:100%;min-width:0}
.input:focus,.select:focus{border-color:var(--signal);outline:none}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* masthead */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .flag{width:30px;height:30px;border-radius:7px;display:block;background:conic-gradient(var(--chalk) 25%,var(--asphalt) 0 50%,var(--chalk) 0 75%,var(--asphalt) 0) 0 0/10px 10px;box-shadow:0 0 0 2px var(--chalk)}
.brand .word{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.08em}
.brand .ar{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:700;color:var(--signal);font-size:20px}
.live-status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);padding:7px 13px;border-radius:999px;background:var(--asphalt-2)}
.live-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live-status.ok::before{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.live-status.off::before{background:var(--a1)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:stretch}
.hero-copy{display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:12px;position:relative}
.hero-copy h1{font-size:clamp(38px,6.4vw,74px);font-weight:800;line-height:.98}
.hero-copy h1 em{font-style:normal;color:var(--signal)}
.hero-copy p{color:var(--dim);font-size:18px;max-width:46ch}
.lanes-deco{display:flex;flex-direction:column;gap:7px;margin-top:6px;max-width:440px}
.lanes-deco span{height:8px;border-radius:999px;background:var(--c);transform-origin:left;animation:dash 1.6s cubic-bezier(.2,.8,.2,1) both}
.lanes-deco span:nth-child(1){--c:var(--a0);width:92%;animation-delay:.05s}
.lanes-deco span:nth-child(2){--c:var(--a1);width:74%;animation-delay:.15s}
.lanes-deco span:nth-child(3){--c:var(--a2);width:83%;animation-delay:.25s}
.lanes-deco span:nth-child(4){--c:var(--a3);width:58%;animation-delay:.35s}
@keyframes dash{from{transform:scaleX(.08)}to{transform:scaleX(1)}}
.join-card{background:var(--asphalt-2);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden}
.join-card::after{content:"";position:absolute;right:0;top:0;bottom:0;width:12px;background:conic-gradient(var(--chalk) 25%,var(--asphalt) 0 50%,var(--chalk) 0 75%,var(--asphalt) 0) 0 0/12px 12px;opacity:.85}
.join-card h2{font-size:24px}
.pin-input{background:var(--asphalt);border:2px solid var(--rim);border-radius:14px;padding:16px;font-family:var(--f-mono);font-weight:700;font-size:30px;letter-spacing:.24em;text-align:center;width:100%;min-width:0}
.pin-input::placeholder{letter-spacing:.06em;font-size:20px;color:var(--faint);font-family:var(--f-body);font-weight:600}
.pin-input:focus{border-color:var(--signal);outline:none}
.hint{font-size:14px;color:var(--dim);min-height:1.5em;margin-right:12px}
.hint.bad{color:var(--bad)}

/* library */
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sec-head h2{font-size:26px}
.lib{display:flex;flex-direction:column;gap:18px}
.lib-note{color:var(--dim);font-size:14px}
.lib-note:empty{display:none}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.qcard{background:var(--asphalt-2);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-width:0}
.qcard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.qcard-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--asphalt-3);font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--chalk)}
.qcard h3{font-size:19px;line-height:1.2}
.qcard-sample{color:var(--dim);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.qcard-actions{display:flex;gap:8px;flex-wrap:wrap}
.qcard .best{font-size:12px;color:var(--signal)}
.lib-skel{height:170px;border-radius:var(--radius);background:linear-gradient(90deg,var(--asphalt-2),var(--asphalt-3),var(--asphalt-2));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

.how{display:flex;flex-direction:column;gap:18px}
.how h2{font-size:26px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
.steps li{counter-increment:s;padding:18px;border-radius:var(--radius);box-shadow:inset 0 0 0 1px var(--line);color:var(--dim);display:flex;flex-direction:column;gap:8px;font-size:15px}
.steps li::before{content:"LAP " counter(s);font-family:var(--f-mono);font-size:12px;color:var(--signal);letter-spacing:.08em}
.steps b{color:var(--chalk)}

/* ===== stage (host screens) ===== */
.stage{flex:1;display:flex;flex-direction:column;gap:20px;padding-block:16px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(1200px 500px at 50% -10%,var(--asphalt-2),transparent 70%),var(--asphalt);position:relative}
.stage-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stage-bar .brand .word{font-size:17px}
.stage-bar .brand .flag{width:22px;height:22px}
.stage-bar .spacer{flex:1}
.stage-bar .meta{color:var(--dim);font-size:14px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--asphalt-3);font-weight:700;font-size:14px}
.pill .num{color:var(--signal)}
.stage-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:auto}
.stage-foot .meta{color:var(--dim)}

/* lobby */
.lobby-main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;flex:1;align-items:start}
.pin-block{background:var(--chalk);color:var(--ink);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pin-block .eyebrow{color:#5b5547}
.pin-block .where{font-size:16px;font-weight:600}
.pin-big{font-family:var(--f-mono);font-weight:700;font-size:clamp(40px,5.2vw,64px);letter-spacing:.04em;line-height:1;white-space:nowrap}
.qr{background:var(--chalk);padding:4px;border-radius:8px;line-height:0}
.qr img,.qr canvas{width:168px;height:168px;image-rendering:pixelated}
.share-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.share-url{font-family:var(--f-mono);font-size:12px;background:#e4dfd1;border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;flex:1;min-width:0;user-select:all}
.pin-block .btn-quiet{background:var(--ink);color:var(--chalk)}
.grid-players{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid-head{display:flex;align-items:baseline;gap:14px}
.grid-head .big{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--signal)}
.grid-head span:last-child{color:var(--dim);font-size:18px;font-weight:600}
.pchips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.pchip{display:inline-flex;align-items:center;gap:10px;padding:7px 8px 7px 7px;border-radius:999px;background:var(--asphalt-3);font-weight:700;font-size:17px;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;max-width:100%}
.pchip .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-size:19px;flex:none}
.pchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pchip button{appearance:none;border:0;background:transparent;color:var(--faint);cursor:pointer;width:26px;height:26px;border-radius:50%;font-size:15px;flex:none}
.pchip button:hover{background:var(--rim);color:var(--chalk)}
.pchip.away{opacity:.45}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.empty-grid{border:2px dashed var(--rim);border-radius:var(--radius);padding:28px;color:var(--dim);text-align:center}

/* question */
.q-head{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.q-type{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
.q-text{font-size:clamp(26px,3.8vw,48px);font-weight:700;max-width:28ch;line-height:1.15}
.q-mid{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px}
.ring{width:118px;height:118px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--asphalt-3)}
.ring .fg{stroke:var(--signal);stroke-linecap:round;transition:stroke .3s}
.ring.hot .fg{stroke:var(--a0)}
.ring .sec{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:38px}
.q-center{display:flex;justify-content:center;min-width:0}
.counter{text-align:center}
.counter .big{font-family:var(--f-display);font-size:46px;font-weight:800;line-height:1}
.counter .lbl{color:var(--dim);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.guess-range{font-size:20px;color:var(--dim);text-align:center}
.guess-range b{color:var(--chalk);font-family:var(--f-mono)}

/* answer tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{--c:var(--a0);appearance:none;border:0;background:var(--c);color:var(--ink);border-radius:var(--radius);display:flex;align-items:center;gap:16px;padding:18px 20px;font-weight:800;font-size:clamp(18px,2.2vw,28px);text-align:start;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2);min-height:84px;position:relative;overflow:hidden;line-height:1.2;min-width:0;transition:opacity .3s,transform .3s,filter .3s}
.tile svg{width:38px;height:38px;flex:none;fill:currentColor}
.tile .tx{min-width:0;overflow-wrap:anywhere}
.tile[data-i="1"]{--c:var(--a1)}
.tile[data-i="2"]{--c:var(--a2)}
.tile[data-i="3"]{--c:var(--a3)}
.tile .cnt{margin-left:auto;font-family:var(--f-mono);font-size:22px;font-weight:700;background:rgba(0,0,0,.16);border-radius:10px;padding:4px 10px;flex:none}
.tile .bar{position:absolute;left:0;bottom:0;height:6px;background:rgba(0,0,0,.35);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tiles.revealed .tile.wrong{opacity:.28;filter:saturate(.5)}
.tiles.revealed .tile.right{transform:scale(1.02);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 0 0 4px var(--chalk)}
.tile .tick{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--c);display:grid;place-items:center;font-size:18px;flex:none}
.stage .tiles{flex:1;grid-auto-rows:minmax(84px,1fr);align-content:stretch}
.stage .tile{font-size:clamp(20px,2.6vw,34px);padding:22px 26px}
.stage .tile svg{width:44px;height:44px}

/* guess reveal */
.numline{position:relative;height:120px;margin:10px 18px 0}
.numline .axis{position:absolute;left:0;right:0;top:64px;height:4px;background:var(--rim);border-radius:2px}
.numline .dot{position:absolute;top:58px;width:16px;height:16px;border-radius:50%;background:var(--a3);transform:translateX(-50%);box-shadow:0 0 0 2px var(--asphalt);transition:left 1s cubic-bezier(.2,.8,.2,1)}
.numline .ans{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.numline .ans b{font-family:var(--f-mono);font-size:28px;color:var(--signal);background:var(--asphalt-3);padding:2px 12px;border-radius:10px;white-space:nowrap}
.numline .ans i{width:3px;height:44px;background:var(--signal);display:block}
.numline .end{position:absolute;top:80px;font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.guess-sum{text-align:center;color:var(--dim);font-size:17px}

/* race board */
.board-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.board-title h2{font-size:clamp(26px,3.4vw,40px)}
.lanes{display:flex;flex-direction:column;gap:12px}
.lane{display:grid;grid-template-columns:2.4ch minmax(0,17ch) minmax(0,1fr) 9ch;align-items:center;gap:16px;animation:slidein .5s cubic-bezier(.2,.8,.2,1) both}
.lane:nth-child(2){animation-delay:.06s}.lane:nth-child(3){animation-delay:.12s}.lane:nth-child(4){animation-delay:.18s}.lane:nth-child(5){animation-delay:.24s}
@keyframes slidein{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.lane .rk{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--dim)}
.lane:first-child .rk{color:var(--signal)}
.lane .nm{font-weight:800;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .nm small{display:block;font-weight:600;font-size:13px;color:var(--dim);white-space:normal}
.track{position:relative;height:52px;border-radius:999px;background:linear-gradient(90deg,transparent 0 18px,var(--line) 18px 36px) 0 50%/36px 2px repeat-x,var(--asphalt-2)}
.track::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;border-radius:0 999px 999px 0;background:conic-gradient(var(--chalk) 25%,var(--asphalt) 0 50%,var(--chalk) 0 75%,var(--asphalt) 0) 0 0/13px 13px;opacity:.8}
.car{position:absolute;top:50%;left:4%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:left 1.6s cubic-bezier(.2,.8,.2,1);z-index:1}
.car .trail{position:absolute;right:50%;top:50%;height:8px;transform:translateY(-50%);border-radius:999px;background:linear-gradient(90deg,transparent,var(--c));opacity:.55;width:0;transition:width 1.6s cubic-bezier(.2,.8,.2,1);z-index:-1}
.lane .pts{text-align:right}
.lane .pts b{font-family:var(--f-mono);font-size:20px;display:block}
.lane .pts span{font-size:13px;font-weight:700;color:var(--good);font-family:var(--f-mono)}
.lane .pts span.neg{color:var(--bad)}
.lane .badge{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--signal-ink);background:var(--signal);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.others{color:var(--dim);font-size:15px}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;max-width:780px;width:100%;margin:0 auto;flex:1;min-height:340px}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;animation:rise .9s cubic-bezier(.2,.9,.2,1) both}
.pod:nth-child(1){animation-delay:.5s}.pod:nth-child(2){animation-delay:1.1s}.pod:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.pod .av{width:68px;height:68px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:38px}
.pod .nm{font-weight:800;font-size:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-family:var(--f-mono);color:var(--dim);font-size:15px}
.pod .block{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:14px;font-family:var(--f-display);font-weight:800;font-size:46px;color:var(--ink)}
.pod.p1 .block{height:210px;background:var(--signal)}
.pod.p2 .block{height:150px;background:var(--chalk)}
.pod.p3 .block{height:110px;background:var(--a1)}
.pod.p1 .av{width:84px;height:84px;font-size:46px;box-shadow:0 0 0 4px var(--signal)}
.final-rest{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--dim)}
.final-rest b{color:var(--chalk);font-family:var(--f-mono)}

/* reactions + confetti */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx canvas{position:absolute;inset:0;width:100%;height:100%}

  .counter .big{font-size:32px}
  .lane{grid-template-columns:2ch minmax(0,1fr) 8ch;gap:10px}

}

/* ---------- quiz data ---------- */
function normQ(q) {
  if (!q || typeof q !== 'object') return null;
  const type = ['choice','tf','guess'].includes(q.type) ? q.type : 'choice';
  const text = str(q.text, 220); if (!text) return null;
  const t = Number(q.time);
  const out = { type, text, time: TIMES.includes(t) ? t : (type === 'guess' ? 30 : type === 'tf' ? 10 : 20) };
  if (type === 'guess') {
    const ans = Number(q.answer); if (!isFinite(ans)) return null;
    let min = Number(q.min), max = Number(q.max);
    if (!isFinite(min)) min = Math.floor(ans - Math.max(10, Math.abs(ans) * .5));
    if (!isFinite(max) || max <= min) max = Math.ceil(ans + Math.max(10, Math.abs(ans) * .5));
    min = Math.min(min, ans); max = Math.max(max, ans); if (max === min) max = min + 10;
    out.answer = ans; out.min = min; out.max = max; out.unit = str(q.unit, 16);
    out.step = [ans, min, max].every(Number.isInteger) ? 1 : 0.1;
  } else {
    let opts = Array.isArray(q.options) ? q.options.map(o => str(o, 90)).filter(Boolean).slice(0, 4) : [];
    if (type === 'tf' && opts.length !== 2) opts = ['True', 'False'];
    if (opts.length < 2) return null;
    out.options = opts;
    let cor = Array.isArray(q.correct) ? q.correct : [q.correct];
    cor = [...new Set(cor.map(Number).filter(i => Number.isInteger(i) && i >= 0 && i < opts.length))];
    if (!cor.length) return null;
    if (type === 'tf') cor = cor.slice(0, 1);
    out.correct = cor;
  }
  return out;
}
function normQuiz(raw) {
  const qs = Array.isArray(raw && raw.questions) ? raw.questions.map(normQ).filter(Boolean).slice(0, 80) : [];
  return { id: raw && raw.id, title: str(raw && raw.title, 90) || 'Untitled quiz', questions: qs, updated: Number(raw && raw.updated) || 0, src: raw && raw.src };
}

/* ---------- scoring ---------- */
function scoreOne(q, a, prevStreak, ddAvail) {
  if (!a) return { ok: false, gain: 0, streak: 0, dd: false, answered: false };
  const limit = q.time * 1000;
  const t = clamp((Number(a.ms) || limit) / limit, 0, 1);
  let ok = false, base = 0, win = false;
  if (q.type === 'guess') {
    const v = Number(a.c), range = Math.max(1e-9, q.max - q.min);
    if (!isFinite(v)) return { ok: false, gain: 0, streak: 0, dd: false, answered: true };
    const err = Math.abs(v - q.answer) / range;
    const close = Math.max(0, 1 - err / .25);
    base = Math.round(1000 * close * close * (1 - t * .25));
    ok = err <= .03; win = err <= .1;
  } else {
    ok = q.correct.includes(Number(a.c));
    base = ok ? Math.round(1000 * (1 - t * .5)) : 0;
    win = ok;
  }
  const streak = ok ? prevStreak + 1 : 0;
  let gain = base + (ok ? Math.min(prevStreak, 5) * 100 : 0);
  const dd = !!a.dd && ddAvail;
  if (dd) gain = win ? gain * 2 : -300;
  return { ok, gain, streak, dd, answered: true };
}
function rankScores(scores) {
  const arr = Object.entries(scores).sort((a, b) => b[1].s - a[1].s);
  let last = null, r = 0;
  arr.forEach(([, v], i) => { if (v.s !== last) { r = i + 1; last = v.s; } v.r = r; });
  return arr;
}

  return p;
}

let H = null;

function hostSess() { sess.set('sibaq-sess', H ? { role: 'host', pin: H.pin, quiz: H.quiz, deadline: H.deadline, game: H.game } : null); }

async function hostStart(quiz) {
  Sound.ensure();
  if (!quiz.questions.length) return toast('This quiz has no questions yet.', 'bad');
  if (!capsDone) { toast('Connecting to the live service…'); await capsP; }
  if (!ROOM) return toast('Live races need the claude.ai viewer. Open this page there while signed in. Practice solo works anywhere.', 'bad');
  let pin = null;
  for (let i = 0; i < 6; i++) {
    const cand = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
    if (!DB) { pin = cand; break; }
    const s = await DB.doc('games/' + cand).get().catch(() => null);
    if (!s || !s.exists || Date.now() - (Number(s.data().at) || 0) > 6 * 3600e3) { pin = cand; break; }
  }
  if (!pin) return toast('Could not reserve a PIN. Try again.', 'bad');
  const game = { v: 1, pin, title: quiz.title, n: quiz.questions.length, phase: 'lobby', q: -1, seq: 0, cur: null, reveal: null, scores: {}, kicked: [], at: Date.now() };
  H = { pin, quiz: JSON.parse(JSON.stringify(quiz)), game, players: new Map(), online: new Set(), answers: {}, reK: {}, g: null, deadline: 0, timer: 0, prev: {}, writing: false, pendingWrite: false, unsub: [] };
  if (DB) {
    try { await DB.doc('games/' + pin).set(game); }
    catch (e) { /* players can still join through the live room */ H.noDb = true; }
  }
  const g = await joinRoom(pin);
  if (!g) { H = null; return toast('Could not open the live room. Try again in a moment.', 'bad'); }
  H.g = g; hostWire(); hostSess(); vHostLobby();
  Sound.loop('lobby');
}

function hostWire() {
  const g = H.g;
  try { g.onPeers(ch => { if (!H || H.g !== g) return; hostPeers(ch.peers); if (ch.joined.some(p => !p.isMe)) emitState(); }); } catch {}
  try { g.onConnection && g.onConnection(c => { if (c && H && H.g === g) emitState(); }); } catch {}
}

function hostPeers(peers) {
  const online = new Set();
  for (const p of peers) {
    if (p.isMe) continue;
    const pr = p.presence || {};
    if (!validPid(pr.pid) || pr.role === 'host') continue;
    if (H.game.kicked.includes(pr.pid)) continue;
    online.add(pr.pid);
    const name = str(pr.name, 20) || 'Racer', av = clamp(parseInt(pr.av, 10) || 0, 0, AV.length - 1);
    const had = H.players.get(pr.pid);
    if (!had) { H.players.set(pr.pid, { name, av }); Sound.join(); }
    else { had.name = name; had.av = av; }
    if (pr.ans && typeof pr.ans === 'object') ingestAnswer(pr.pid, pr.ans);
    const re = pr.re;
    if (re && typeof re.k === 'number') {
      const last = H.reK[pr.pid];
      if (last !== undefined && re.k > last && REACTS[re.e] && (view === 'h-lobby' || view === 'h-question' || view === 'h-board' || view === 'h-final' || view === 'h-reveal')) floatReact(REACTS[re.e]);
      H.reK[pr.pid] = re.k;
    }
  }
  H.online = online;
  if (H.game.phase === 'lobby') { for (const id of [...H.players.keys()]) if (!online.has(id)) H.players.delete(id); }
  hostPaintPlayers(); hostPaintCount();
}

function ingestAnswer(pid, a) {
  const G = H.game;
  if (G.phase !== 'question' || Number(a.seq) !== G.seq || H.answers[pid] || !H.players.has(pid)) return;
  const q = H.quiz.questions[G.q];
  let c;
  if (q.type === 'guess') { c = Number(a.c); if (!isFinite(c)) return; c = clamp(c, q.min, q.max); }
  else { c = Number(a.c); if (!Number.isInteger(c) || c < 0 || c >= q.options.length) return; }
  H.answers[pid] = { c, ms: clamp(Number(a.ms) || 0, 0, q.time * 1000), dd: !!a.dd };
  hostPaintCount();
  const need = [...H.online].filter(id => H.players.has(id));
  if (need.length && need.every(id => H.answers[id])) {
    const seq = G.seq;
    setTimeout(() => { if (H && H.game.phase === 'question' && H.game.seq === seq) hostReveal(); }, 700);
  }
}

  H.game.v++; H.game.at = Date.now();

}
async function writeGame() {
  if (!DB || !H || H.noDb) return;
  H.pendingWrite = true;
  if (H.writing) return;
  H.writing = true;
  const h = H;
  while (h.pendingWrite) {
    h.pendingWrite = false;
    try { await DB.doc('games/' + h.pin).set(JSON.parse(JSON.stringify(h.game))); } catch {}
  }
  h.writing = false;
}
function emitState() {
  if (!H || !H.g) return;
  let payload = H.game;
  if (bytes(payload) > 3800) {
    payload = Object.assign({}, H.game, { scores: null, partial: true, reveal: H.game.reveal ? Object.assign({}, H.game.reveal, { guesses: [] }) : null });

  try { H.g.emit('state', payload).catch(() => {}); } catch {}
}

function hostStartQ(i) {
  const q = H.quiz.questions[i];
  H.answers = {};
  Object.assign(H.game, { phase: 'question', q: i, seq: H.game.seq + 1, cur: publicQ(q, i, H.quiz.questions.length), reveal: null });
  H.deadline = Date.now() + q.time * 1000 + 900;
  broadcast(); vHostQuestion(); hostTimer();
  Sound.loop('race');
}
function hostTimer() {
  clearInterval(H.timer);
  let lastSec = -1; const h = H;
  h.timer = setInterval(() => {
    if (H !== h || h.game.phase !== 'question') { clearInterval(h.timer); return; }
    const total = h.quiz.questions[h.game.q].time * 1000;
    const left = Math.max(0, h.deadline - Date.now());
    paintRing(Math.min(left, total), total);
    const sec = Math.ceil(Math.min(left, total) / 1000);
    if (sec !== lastSec) { lastSec = sec; if (sec <= 5 && sec > 0) Sound.tick(); }
    if (left <= 0) { clearInterval(h.timer); hostReveal(); }
  }, 100);
}
function paintRing(left, total) {
  const fg = $('#ringFg'), sec = $('#ringSec'), ring = $('#ring'); if (!fg) return;
  const C = 2 * Math.PI * 52;
  fg.style.strokeDasharray = C; fg.style.strokeDashoffset = C * (1 - left / total);
  sec.textContent = Math.ceil(left / 1000);
  ring.classList.toggle('hot', left <= 5000);
}
const ringSvg = () => `<div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52"/></svg><span class="sec" id="ringSec"></span></div>`;
const typeLabel = q => q.type === 'guess' ? 'Closest guess wins' : q.type === 'tf' ? 'True or false' : 'Pick one';

function hostReveal() {
  if (!H || H.game.phase !== 'question') return;
  clearInterval(H.timer); Sound.stopLoop();
  const qi = H.game.q, q = H.quiz.questions[qi];
  H.prev = {};
  for (const [k, v] of Object.entries(H.game.scores)) H.prev[k] = v.s;
  const dist = q.type === 'guess' ? null : q.options.map(() => 0);
  const guesses = [];
  for (const [pid, p] of H.players) {
    const prev = H.game.scores[pid] || { s: 0, st: 0, du: false };
    const a = H.answers[pid];
    const res = scoreOne(q, a, prev.st || 0, !prev.du);
    if (a) { if (dist) dist[a.c]++; else guesses.push(Math.round(a.c * 100) / 100); }
    H.game.scores[pid] = { n: p.name, a: p.av, s: Math.max(0, (prev.s || 0) + res.gain), g: res.gain, ok: a ? (res.ok ? 1 : 0) : -1, st: res.streak, du: !!(prev.du || res.dd), dd: res.dd ? 1 : 0, c: a ? a.c : null };
  }
  rankScores(H.game.scores);
  H.game.phase = 'reveal';
  H.game.reveal = { correct: q.correct || null, answer: q.type === 'guess' ? q.answer : null, dist, guesses: guesses.slice(0, 40), answered: Object.keys(H.answers).length };
  broadcast(); vHostReveal(); Sound.reveal();
}

function vHostReveal() {
  const q = H.quiz.questions[H.game.q], R = H.game.reveal, total = Math.max(1, R.answered);
  let body;
  if (q.type === 'guess') {
    const pos = v => clamp((v - q.min) / (q.max - q.min) * 100, 0, 100);
    const gs = R.guesses || [];
    const avg = gs.length ? gs.reduce((a, b) => a + b, 0) / gs.length : null;
    const closest = Object.values(H.game.scores).filter(s => s.c != null).sort((a, b) => Math.abs(a.c - q.answer) - Math.abs(b.c - q.answer))[0];
    body = `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px">
      <div class="numline">
        <div class="axis"></div>
        ${gs.map((v, k) => `<span class="dot" style="left:${pos(v)}%;top:${58 + ((k % 3) - 1) * 14}px"></span>`).join('')}
        <div class="ans" style="left:${pos(q.answer)}%"><b>${fmtNum(q.answer)}${q.unit ? ' ' + esc(q.unit) : ''}</b><i></i></div>
        <span class="end" style="left:0">${fmtNum(q.min)}</span><span class="end" style="right:0">${fmtNum(q.max)}</span>
      </div>
      <p class="guess-sum">${gs.length ? `Average guess <b class="num">${fmtNum(Math.round(avg * 10) / 10)}</b>${closest ? ` · Closest: <b dir="auto">${esc(closest.n)}</b> with <b class="num">${fmtNum(closest.c)}</b>` : ''}` : 'Nobody guessed this one.'}</p>
    </div>`;
  } else {
    body = `<div class="tiles revealed">${q.options.map((o, k) => {
      const right = q.correct.includes(k);
      return `<div class="tile ${right ? 'right' : 'wrong'}" data-i="${k}">${right ? '<span class="tick">✓</span>' : glyph(k)}<span class="tx" dir="auto">${esc(o)}</span><span class="cnt">${R.dist[k]}</span><span class="bar" data-w="${Math.round(R.dist[k] / total * 100)}"></span></div>`;
    }).join('')}</div>`;
  }
  const last = H.game.q === H.quiz.questions.length - 1;
  mount(`<div class="stage">
    ${stageBar(`<span class="pill">Q <span class="num">${H.game.q + 1}/${H.quiz.questions.length}</span></span>`)}
    <div class="q-head"><span class="q-type">${q.type === 'guess' ? 'The answer' : 'Correct answer'}</span><h1 class="q-text" dir="auto">${esc(q.text)}</h1></div>
    ${body}
    <footer class="stage-foot"><span class="meta">${R.answered} of ${H.players.size} answered</span>
      <button class="btn btn-signal lg" data-act="h-board">${last ? 'Final standings' : 'Standings'}</button></footer>
  </div>`, 'h-reveal');
  requestAnimationFrame(() => requestAnimationFrame(() => $$('.tile .bar').forEach(b => b.style.width = b.dataset.w + '%')));
}

async function hostClose() {
  if (!H) return vHome();
  const h = H; H = null; hostSess();
  clearInterval(h.timer); Sound.stopLoop();
  try { await h.g.emit('state', { v: h.game.v + 1, pin: h.pin, phase: 'closed', q: -1, seq: h.game.seq, n: h.game.n, kicked: [] }); } catch {}
  if (DB) DB.doc('games/' + h.pin).delete().catch(() => {});
  setTimeout(() => { try { h.g.leave(); } catch {} }, 600);
  vHome('Room closed.');
}

async function hostResume(sv) {
  if (!ROOM || !sv.quiz || !sv.game) return false;
  const quiz = normQuiz(sv.quiz); if (!quiz.questions.length) return false;
  let game = sv.game;
  if (DB) { const s = await DB.doc('games/' + sv.pin).get().catch(() => null); if (s && s.exists && s.data().v >= game.v) game = s.data(); else if (s && !s.exists && !sv.game) return false; }
  if (!game || game.phase === 'closed') return false;
  game.kicked = Array.isArray(game.kicked) ? game.kicked : []; game.scores = game.scores || {};
  H = { pin: sv.pin, quiz, game, players: new Map(), online: new Set(), answers: {}, reK: {}, g: null, deadline: Number(sv.deadline) || 0, timer: 0, prev: {}, writing: false, pendingWrite: false, unsub: [] };
  for (const [pid, s] of Object.entries(game.scores)) H.players.set(pid, { name: s.n, av: s.a });
  H.g = await joinRoom(sv.pin);
  if (!H.g) { H = null; return false; }
  hostWire();
  const ph = game.phase;
  if (ph === 'lobby') { vHostLobby(); Sound.loop('lobby'); }
  else if (ph === 'question') { vHostQuestion(); if (H.deadline > Date.now()) hostTimer(); else hostReveal(); }
  else if (ph === 'reveal') vHostReveal();
  else if (ph === 'board') vHostBoard();
  else vHostFinal();
  emitState();
  return true;
}

let P = null;
let PAD = null; // current answer pad context

function playerSess() { sess.set('sibaq-sess', P ? { role: 'player', pin: P.pin, pid: P.pid, name: P.name, av: P.av, answered: P.answered, ddUsed: P.ddUsed, re: P.re } : null); }

async function startJoin(pin) {

  }

}

function vJoinName(pin, info) {
  const saved = local.get('sibaq-me', {}) || {};
  let av = Number.isInteger(saved.av) ? saved.av : Math.floor(Math.random() * AV.length);
  mount(`<div class="join-shell">

      <div class="field"><label id="avLbl">Pick your racer</label>
        <div class="avatars" role="group" aria-labelledby="avLbl">${AV.map((a, i) => `<button type="button" data-av="${i}" style="--c:${avColor(i)}" aria-pressed="${i === av}" aria-label="Racer ${i + 1}">${a}</button>`).join('')}</div>
      </div>

async function playerJoin(pin, name, av, restore) {
  P = { pin, pid: tabId(), name, av, game: null, answered: {}, t0: {}, g: null, unsub: [], lastKey: '', ddUsed: false, re: { e: 0, k: 0 }, lastAns: null, reT: 0 };
  if (restore) { P.answered = restore.answered || {}; P.ddUsed = !!restore.ddUsed; if (restore.re) P.re = restore.re; }
  const ks = Object.keys(P.answered).map(Number); if (ks.length) { const m = Math.max(...ks); P.lastAns = Object.assign({ seq: m }, P.answered[m]); }
  vPlayerStatus('neutral', '<div class="spinner"></div>', 'Joining…', 'Connecting to the race room.');
  const g = await joinRoom(pin);
  if (!P) return;
  if (!g) { P = null; playerSess(); return vHome('Could not reach the race room. Check the PIN and try again.'); }
  P.g = g;
  g.on('state', m => { if (!P || P.g !== g || !m.data || typeof m.data !== 'object') return; applyGame(m.data); });
  try { g.onConnection && g.onConnection(c => { if (c && P && P.g === g) pushPresence(); }); } catch {}
  pushPresence();
  if (DB) {
    try {
      P.unsub.push(DB.doc('games/' + pin).onSnapshot(s => { if (!P) return; if (s.exists) applyGame(s.data()); else if (P.game && !s.metadata.fromCache) playerGone('The host closed this race.'); }, () => {}));
    } catch {}
  }
  playerSess();
  const p0 = P;
  setTimeout(() => { if (P === p0 && !P.game) vPlayerStatus('neutral', '<div class="spinner"></div>', 'Waiting for the host', `No answer yet from race ${pin.slice(0, 3)} ${pin.slice(3)}. Keep this page open; you will join as soon as the host's screen is live. If nothing happens, check the PIN.`, `<button class="btn btn-ghost" data-act="p-leave">Leave</button>`); }, 7000);
}
function pushPresence() {
  if (!P || !P.g) return;
  P.g.presence({ pid: P.pid, role: 'player', name: P.name, av: P.av, ans: P.lastAns, re: P.re }).catch(() => {});
}
function applyGame(g) {
  if (!P || typeof g.v !== 'number') return;
  const cur = P.game;
  if (cur && !(g.v > cur.v || (g.v === cur.v && cur.partial && !g.partial))) return;
  if (g.partial && cur && cur.scores) g = Object.assign({}, g, { scores: cur.scores });
  P.game = g;
  if (g.phase === 'closed') return playerGone('The host closed this race. Thanks for playing!');
  if (Array.isArray(g.kicked) && g.kicked.includes(P.pid)) return playerGone('The host removed you from this race.');
  const key = g.phase + ':' + g.seq + (g.partial ? ':p' : '');
  if (key === P.lastKey) return;
  P.lastKey = key;
  playerRender();
}
function playerGone(msg) {
  if (!P) return;
  const p = P; P = null; playerSess(); PAD = null;
  p.unsub.forEach(u => { try { u(); } catch {} });
  try { p.g && p.g.leave(); } catch {}
  vHome(msg);
}
ACT['p-leave'] = () => playerGone('You left the race.');

const myScore = () => (P && P.game && P.game.scores && P.game.scores[P.pid]) || null;

}

const reactBar = () => `<div class="reacts" aria-label="Send a reaction to the big screen">${REACTS.map((r, i) => `<button data-act="p-react" data-e="${i}" aria-label="React ${r}">${r}</button>`).join('')}</div>`;

function answerPad(cur, ddAvail) {

let SOLO = null;
function soloStart(quiz) {

function soloQ() {
  const q = SOLO.quiz.questions[SOLO.i], n = SOLO.quiz.questions.length;
  const cur = publicQ(q, SOLO.i, n);
  const ddAvail = !SOLO.du;
  mount(`<div class="pad-screen">

}
function soloAnswer(c, ms) {
  clearTimeout(SOLO.timer);
  const q = SOLO.quiz.questions[SOLO.i];

  const r = scoreOne(q, a, SOLO.st, !SOLO.du);

  const good = q.type === 'guess' ? r.gain > 0 : r.ok;

  const title = !a ? "Time's up" : q.type === 'guess' ? (r.ok ? 'Spot on!' : r.gain > 400 ? 'So close!' : r.gain > 0 ? 'In the zone' : 'Way off') : r.ok ? (r.dd ? 'Doubled!' : 'Correct') : (r.dd ? 'Double Down backfired' : 'Not this time');
  const last = SOLO.i === SOLO.quiz.questions.length - 1;
  mount(`<div class="pad-screen">

    <div class="status-card ${good ? 'good' : 'bad'}"><h2>${title}</h2><p>${right}</p><span class="gain" ${r.gain < 0 ? 'style="color:var(--bad)"' : ''}>${r.gain >= 0 ? '+' : ''}${fmt(r.gain)}</span>${r.streak >= 2 ? `<p class="sub">${r.streak} in a row</p>` : ''}
      <button class="btn btn-signal lg" data-act="solo-next">${last ? 'See results' : 'Next question'}</button></div>
  </div>`, 'solo-r');
}

  B.questions.forEach((q, i) => {
    const n = i + 1;
    if (!str(q.text, 220)) { if (q.type === 'guess' ? String(q.answer).trim() : (q.options || []).some(o => str(o, 90))) errs.push(`Q${n} needs question text.`); return; }
    if (q.type === 'guess') {
      const ans = Number(String(q.answer).replace(',', '.')), min = Number(String(q.min).replace(',', '.')), max = Number(String(q.max).replace(',', '.'));
      if (!isFinite(ans) || String(q.answer).trim() === '') return errs.push(`Q${n} needs a number for the answer.`);
      if (!isFinite(min) || !isFinite(max) || max <= min) return errs.push(`Q${n}: "slider to" must be bigger than "slider from".`);
      if (ans < min || ans > max) return errs.push(`Q${n}: the answer must sit between the slider ends.`);
      qs.push(normQ({ type: 'guess', text: q.text, answer: ans, min, max, unit: q.unit, time: q.time }));
    } else {
      const kept = [], map = {};
      q.options.forEach((o, k) => { if (str(o, 90)) { map[k] = kept.length; kept.push(o); } });
      if (kept.length < 2) return errs.push(`Q${n} needs at least two answers.`);
      const cor = q.correct.filter(k => map[k] !== undefined).map(k => map[k]);
      if (!cor.length) return errs.push(`Q${n}: mark the correct answer.`);
      qs.push(normQ({ type: q.type, text: q.text, options: kept, correct: cor, time: q.time }));
    }
  });
  if (!qs.length && !errs.length) errs.push('Add at least one question.');
  return { errs, quiz: { title: str(B.title, 90) || 'Untitled quiz', questions: qs.filter(Boolean), updated: Date.now() } };
}
ACT['b-save'] = async el => {
  const { errs, quiz } = builderToQuiz();
  if (errs.length) { $('#bErr').textContent = errs[0] + (errs.length > 1 ? ` (+${errs.length - 1} more)` : ''); return; }
  el.disabled = true;
  let id = B.id, src = B.src;
  if (!id) id = 'q' + uid(9);
  let savedTo = null;
  if ((src === 'saved' || !src) && DB) {
    try { await DB.collection('quizzes').doc(id).set(quiz); savedTo = 'saved'; }
    catch (e) { toast(errMsg(e) + ' Saved on this device instead.'); }
  }
  if (!savedTo) {
    if (src === 'saved') id = 'q' + uid(9);
    const entry = Object.assign({}, quiz, { id, src: 'local' });
    LIB.local = [entry, ...LIB.local.filter(q => q.id !== id)]; saveLocalLib(); savedTo = 'local';
  }
  B.id = id; B.src = savedTo; el.disabled = false;
  const full = Object.assign({}, quiz, { id, src: savedTo });
  if (savedTo === 'saved') { LIB.saved = [full, ...LIB.saved.filter(q => q.id !== id)]; }
  toast(savedTo === 'saved' ? 'Saved to the shared library.' : 'Saved on this device.');
  paintWhere();
  if (el.dataset.then === 'host') hostStart(full);
  else if (el.dataset.then === 'solo') soloStart(full);
};
ACT['b-del'] = async el => {
  if (!el.dataset.armed) { el.dataset.armed = '1'; el.textContent = 'Tap again to delete'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = 'Delete'; } }, 3000); return; }
  if (B.src === 'saved' && DB) { try { await DB.doc('quizzes/' + B.id).delete(); LIB.saved = LIB.saved.filter(q => q.id !== B.id); } catch (e) { return toast(errMsg(e), 'bad'); } }
  if (B.src === 'local') { LIB.local = LIB.local.filter(q => q.id !== B.id); saveLocalLib(); }
  vHome('Quiz deleted.');
};

/* ----- draft with Claude ----- */
let aiAbort = null;
function paintAI() {
  const p = $('#aiPanel'); if (!p) return;
  if (!capsDone) { p.innerHTML = '<h3>Draft questions with Claude</h3><p class="ai-status">Checking whether Claude is available here…</p>'; return; }
  if (!SAMPLE) { p.hidden = true; return; }
  p.hidden = false;
  p.innerHTML = `<h3>Draft questions with Claude <span class="chip">AI</span></h3>
    <div class="ai-row">
      <div class="field"><label for="aiTopic">Topic</label><input id="aiTopic" class="input" dir="auto" maxlength="160" placeholder="e.g. African football legends, the solar system, 90s films"></div>
      <div class="field"><label for="aiCount">Questions</label><select id="aiCount" class="select"><option>5</option><option selected>8</option><option>10</option><option>15</option></select></div>
      <div class="field"><label for="aiLang">Language</label><select id="aiLang" class="select"><option>English</option><option value="Arabic">العربية</option><option>French</option><option>Spanish</option></select></div>
      <div class="field"><label for="aiLevel">Level</label><select id="aiLevel" class="select"><option>Easy</option><option selected>Mixed</option><option>Hard</option></select></div>
      <button class="btn btn-signal" data-act="ai-go" id="aiGo">Draft</button>
    </div>
    <p class="ai-status" id="aiStatus">Claude writes the questions; you check and edit them before racing. Drafts are added below.</p>`;
}
ACT['ai-go'] = async el => {
  if (aiAbort) { aiAbort.abort(); return; }
  const topic = str($('#aiTopic').value, 160), st = $('#aiStatus');
  if (!topic) { st.textContent = 'Add a topic first.'; st.className = 'ai-status bad'; return; }
  const n = Number($('#aiCount').value), lang = $('#aiLang').value, level = $('#aiLevel').value;
  const prompt = `You write questions for a live party quiz game played on phones.
Topic: ${topic}
Difficulty: ${level}
Language: write every question, option and unit in ${lang}.
Number of questions: ${n}
Mix: about 65% multiple choice with exactly 4 short options and one correct answer, about 20% true/false statements, and about 15% number guesses whose answer is one specific, well-established number.
Rules: keep each question under 110 characters and each option under 40 characters. Use only accurate facts that do not change over time. Vary which option position is correct. No trick wording.
Return only JSON in this exact shape:
{"title": "short catchy quiz title",
 "questions": [
  {"type":"choice","text":"...","options":["...","...","...","..."],"correct":0},
  {"type":"tf","text":"a statement","answer":true},
  {"type":"guess","text":"...","answer":1969,"min":1900,"max":2020,"unit":""}
 ]}
For guess questions, set min and max so the answer is not at the centre and the range is sensible.`;
  aiAbort = new AbortController();
  el.textContent = 'Stop'; st.className = 'ai-status'; st.textContent = 'Thinking… this usually takes 15 to 60 seconds.';
  try {
    const data = await SAMPLE.json(prompt, { signal: aiAbort.signal, modelTier: 'default', cache: false });
    const tf = lang === 'Arabic' ? ['صح', 'خطأ'] : lang === 'French' ? ['Vrai', 'Faux'] : lang === 'Spanish' ? ['Verdadero', 'Falso'] : ['True', 'False'];
    const raw = Array.isArray(data && data.questions) ? data.questions : [];
    const got = raw.map(q => {
      if (!q) return null;
      if (q.type === 'tf') return normQ({ type: 'tf', text: q.text, options: tf, correct: [q.answer === false || q.answer === 'false' ? 1 : 0], time: 10 });
      if (q.type === 'guess') return normQ({ type: 'guess', text: q.text, answer: q.answer, min: q.min, max: q.max, unit: q.unit, time: 30 });
      return normQ({ type: 'choice', text: q.text, options: q.options, correct: [Number(q.correct)], time: 20 });
    }).filter(Boolean);
    if (!got.length) throw { code: 'empty' };
    B.questions = B.questions.filter(q => str(q.text, 220));
    got.forEach(q => B.questions.push(q.type === 'choice' ? Object.assign({}, q, { options: [...q.options, '', '', '', ''].slice(0, 4) }) : q));
    if (!str(B.title, 90) && data.title) { B.title = str(data.title, 90); const t = $('#bTitle'); if (t) t.value = B.title; }
    paintBuilder();
    st.textContent = `Added ${got.length} questions. Check the facts, then save.`;
  } catch (e) {
    st.className = 'ai-status bad';
    st.textContent = e && e.name === 'AbortError' || (e && e.code === 'aborted') ? 'Stopped.' :
      e && e.code === 'not_granted' ? 'Claude was not allowed on this page, so drafting is off for this visit.' :
      e && e.code === 'rate_limited' ? 'Claude is busy or your usage limit was reached. Try again in a minute.' :
      e && e.code === 'empty' ? 'Claude did not return usable questions. Try a more specific topic.' :
      'Drafting failed. Try again.';
  } finally {
    aiAbort = null; const b = $('#aiGo'); if (b) b.textContent = 'Draft';
  }
};

function handleHash() {
  const m = /^#join-(\d{6})$/.exec(location.hash || '');
  if (m && !H && !P) { if (view !== 'home') vHome(); const i = $('#pinIn'); if (i) i.value = m[1].slice(0, 3) + ' ' + m[1].slice(3); startJoin(m[1]); }
}
window.addEventListener('hashchange', handleHash);

try {
  window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function' &&
    window.claude.hot.snapshot(() => ({ sess: sess.get('sibaq-sess'), builder: view === 'builder' ? B : null }));
} catch {}

async function start(data) {
  data = data || {};
  const sv = data.sess || sess.get('sibaq-sess');
  if (sv && (sv.role === 'host' || sv.role === 'player')) {
    mount(`<div class="pad-screen"><div class="status-card neutral"><div class="spinner"></div><h2>Rejoining your race…</h2><p>PIN ${esc(String(sv.pin || ''))}</p><button class="btn btn-ghost" data-act="forget">Start over instead</button></div></div>`, 'resume');
    await capsP;
    if (view !== 'resume') return;
    let ok = false;
    if (sv.role === 'host') ok = await hostResume(sv).catch(() => false);
    else if (sv.role === 'player' && ROOM && validPid(sv.pid)) { await playerJoin(String(sv.pin), str(sv.name, 20) || 'Racer', clamp(Number(sv.av) || 0, 0, AV.length - 1), sv); ok = true; }
    if (!ok) { sess.set('sibaq-sess', null); vHome(); }
    return;
  }
  if (data.builder) { vBuilder(data.builder); return; }
  vHome();
  handleHash();
}
ACT['forget'] = () => { sess.set('sibaq-sess', null); H = null; P = null; vHome(); };

try {
  if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
} catch { start({}); }

})();
</script>
